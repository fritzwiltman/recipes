title: Tikka Chicken Marinade
description: Yogurt marinade for 1.4 lbs chicken, seared in cast iron and finished in tikka masala or butter masala sauce.
category: Main
cuisine: Indian
servings: 4
prep_minutes: 15
marinate_minutes: 120
cook_minutes: 20
tags: [chicken, marinade, tikka masala, butter chicken]

ingredients:
  - 1.4 lbs boneless chicken (thighs preferred)
  - 3/4 cup plain yogurt (whole milk or Greek)
  - 1 1/2 tbsp ginger paste
  - 3 garlic cloves, minced
  - 1 tbsp lemon juice (about half a lemon)
  - 2 tsp garam masala
  - 2 tsp paprika or chili powder
  - 1 tsp salt
  - 1/2 tsp ground cumin (optional)
  - 1/2 tsp ground turmeric (optional)
  - 1 to 2 tbsp oil, for searing

steps:
  - Cut the chicken into bite-size cubes.
  - In a bowl, combine the yogurt, ginger paste, garlic, lemon juice, garam masala, paprika or chili powder, salt, and the cumin and turmeric if using.
  - Add the chicken to the marinade and mix until every piece is well coated.
  - Cover and refrigerate for a few hours. 20 to 30 minutes works in a pinch, but longer deepens the flavor.
  - Preheat a cast iron pan for a few minutes over medium-high to high heat, then add 1 to 2 tablespoons of oil.
  - Let the excess marinade drip off each piece, then sear in a single layer without crowding. Leave the pieces alone for 2 to 3 minutes per side until they have charred spots. They don't need to be cooked through yet.
  - Add the seared chicken to the simmering sauce and cook 8 to 10 minutes until cooked through.

notes:
  - Works the same way for butter masala (butter chicken). Only the sauce changes.
  - Don't pat the chicken dry before searing. The yogurt coating is what chars.
  - Serve over basmati rice. Rinse it, use 1.5 cups water per 1 cup rice, simmer covered 15 to 18 minutes, then rest 5 to 10 minutes.
